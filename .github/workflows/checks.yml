name: checks

# Shared checks from ci-baseline: gitleaks, Trivy and Semgrep from baseline.yml, commitlint, the
# commit hygiene check and the Markdown link check from conventions.yml. This repo has no .NET code, so CodeQL and
# NuGetAudit are off.

on:
  pull_request:
    # edited: a change to the pull request body is checked for session links too.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  baseline:
    uses: MarcelRoozekrans/ci-baseline/.github/workflows/baseline.yml@v1
    permissions:
      contents: read
      security-events: write
      actions: read
    with:
      codeql: false
      dotnet: false
      trivy: true
      semgrep: true

  conventions:
    uses: MarcelRoozekrans/ci-baseline/.github/workflows/conventions.yml@v1
    with:
      commit-hygiene: true
